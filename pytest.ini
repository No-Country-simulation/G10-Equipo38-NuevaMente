# =============================================================================
# Configuracion de pytest (issue #02): "configurar imports para ejecutar
# pytest desde la raiz". Este archivo vive en la raiz del repo, y pytest lo
# detecta al arrancar; a partir de ahi, el comando es siempre `pytest`
# parado en la raiz — exactamente lo que hace la CI (paso "Tests" de
# .github/workflows/ci.yml) y lo que debe hacer cada dev antes de un push.
# =============================================================================

[pytest]
# Donde buscar tests: la suite del proyecto vive en backend/tests (§15 de
# decisiones_proyecto.md). El frontend Streamlit se verifica por ahora con
# smoke tests de importacion que tambien corren desde esa suite.
testpaths = backend/tests

# `pythonpath` agrega directorios al sys.path de los tests (mismo efecto que
# la variable de entorno PYTHONPATH, pero versionado en el repo y por lo
# tanto identico para todos). Es necesario porque:
#   - el backend se importa como paquete `app` -> hay que exponer backend/
#     (por eso cada directorio tiene su __init__.py, ver issue #01);
#   - los paquetes del frontend (components, i18n, pages) importan por su
#     nombre -> hay que exponer frontend/.
# Asi el smoke test de backend/tests/test_smoke.py puede hacer `import app`
# aunque el archivo viva en otra carpeta del monorepo.
pythonpath = backend frontend
